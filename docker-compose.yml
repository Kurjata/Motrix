services:
  motrix:
    build: .
    image: motrix:latest
    container_name: motrix
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # banco, uploads e imagens extraidas sobrevivem ao recriar o container
      - motrix-dados:/app/data
    environment:
      MAX_UPLOAD_BYTES: "209715200"

volumes:
  motrix-dados:
