services:
  catalogo:
    build: .
    image: catalogo-pecas:latest
    container_name: catalogo-pecas
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # banco, uploads e imagens extraidas sobrevivem ao recriar o container
      - catalogo-dados:/app/data
    environment:
      MAX_UPLOAD_BYTES: "209715200"

volumes:
  catalogo-dados:
